services:
  - type: keyvalue
    name: samira-reel-queue
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: samira-collection-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_REEL_PRODUCT_IMPORT
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: samira-reel-queue
          property: connectionString
      - key: REQUIRE_DATABASE
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: PUBLIC_API_URL
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_PHONE_NUMBERS
        sync: false
      # Switch to "production" once a real SMS provider is connected. In demo
      # mode the fixed DEMO_OTP is accepted and returned to the client.
      - key: OTP_MODE
        value: demo
      - key: DEMO_OTP
        value: "123456"
      - key: OTP_PROVIDER
        value: sms
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: "60"
      - key: SMS_PROVIDER
        value: twilio
      - key: SMS_ACCOUNT_SID
        sync: false
      - key: SMS_AUTH_TOKEN
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: SMS_9999133567_ACCOUNT_SID
        sync: false
      - key: SMS_9999133567_AUTH_TOKEN
        sync: false
      - key: SMS_9999133567_SENDER_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: samira-products
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_FOLDER
        value: products
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: samira-products
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash

  - type: pserv
    name: samira-reel-ai-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./ai-video-worker/Dockerfile
    envVars:
      - key: AI_VIDEO_WORKER_SERVICE_TOKEN
        generateValue: true
      - key: MODEL_DEVICE
        value: cpu
      - key: MAX_PROCESSING_SECONDS
        value: "1200"
      - key: R2_ACCOUNT_ID
        fromService:
          type: web
          name: samira-collection-backend
          envVarKey: R2_ACCOUNT_ID
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: samira-collection-backend
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: samira-collection-backend
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET_NAME
        fromService:
          type: web
          name: samira-collection-backend
          envVarKey: R2_BUCKET_NAME
      - key: R2_PUBLIC_URL
        fromService:
          type: web
          name: samira-collection-backend
          envVarKey: R2_PUBLIC_URL

  - type: worker
    name: samira-reel-queue-worker
    runtime: node
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm run worker:reels
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_REEL_PRODUCT_IMPORT
        value: "true"
      - key: MONGO_URI
        fromService:
          type: web
          name: samira-collection-backend
          envVarKey: MONGO_URI
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: samira-reel-queue
          property: connectionString
      - key: AI_VIDEO_WORKER_URL
        fromService:
          type: pserv
          name: samira-reel-ai-worker
          property: hostport
      - key: AI_VIDEO_WORKER_SERVICE_TOKEN
        fromService:
          type: pserv
          name: samira-reel-ai-worker
          envVarKey: AI_VIDEO_WORKER_SERVICE_TOKEN
